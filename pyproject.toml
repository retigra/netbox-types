[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-types"
dynamic = ["version"]
requires-python = ">=3.12"
description = "NetBox type stubs and modules for type checking and development"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Retigra", email = "info@retigra.nl" },
    { name = "Wouter de Bruijn", email = "wouter@hedium.nl" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "netbox",
    "types",
    "stubs",
    "type hints",
    "type checking",
    "development",
]

# Core dependencies from NetBox requirements.txt
dependencies = [
    "colorama==0.4.6",
    "django==6.1.2",
    "django-cors-headers==4.9.0",
    "django-debug-toolbar==8.0.0",
    "django-filter==26.2",
    "django-htmx==1.29.0",
    "django-mptt==0.18.0",
    "django-pgware==1.0.0",
    "django-prometheus==2.4.0",
    "django-redis==7.0.0",
    "django-rich==2.2.0",
    "django-rq==4.2.0",
    "django-storages==1.14.6",
    "django-tables2==3.0.1",
    "django-taggit==6.1.0",
    "django-timezone-field==7.2.2",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.10.1",
    "feedparser==6.0.14",
    "gunicorn==26.2.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "markdown==3.11.2",
    "mkdocs==1.6.1",
    "mkdocstrings==1.0.8",
    "mkdocstrings-python==2.0.10",
    "netaddr==1.3.0",
    "nh3==0.3.7",
    "pillow==13.0.0",
    "psycopg[c,pool]==3.3.6",
    "pymdown-extensions==12.1",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "requests==2.34.2",
    "rq==2.12.0",
    "social-auth-app-django==6.1.0",
    "social-auth-core==5.2.0",
    "sorl-thumbnail==13.4.0",
    "strawberry-graphql==0.338.0",
    "strawberry-graphql-django==0.93.0",
    "svgwrite==1.4.3",
    "tablib==3.10.0",
    "tzdata==2026.5",
    "zensical==0.0.73",
]

[project.urls]
Homepage = "https://github.com/retigra/netbox-types"
Documentation = "https://github.com/retigra/netbox-types/blob/main/README.md"
Source = "https://github.com/retigra/netbox-types"
Issues = "https://github.com/retigra/netbox-types/issues"

# Configure setuptools to find the netbox package
[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["netbox/netbox"]
include = [
    "account*",
    "circuits*",
    "core*",
    "dcim*",
    "extras*",
    "ipam*",
    "netbox*",
    "tenancy*",
    "users*",
    "utilities*",
    "virtualization*",
    "vpn*",
    "wireless*",
]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
# Get version from git tags
root = "."
tag_regex = "^v(?P<version>[0-9.]+)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
