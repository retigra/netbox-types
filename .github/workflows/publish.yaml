name: Build and Publish Python Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Check for py.typed markers
        run: |
          for wheel in dist/*.whl; do
            python3 -c 'import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(0 if "netbox/py.typed" in names and "dcim/py.typed" in names else f"py.typed missing from {sys.argv[1]}")' "$wheel"
          done

      - name: Publish package
        run: uv publish dist/*
