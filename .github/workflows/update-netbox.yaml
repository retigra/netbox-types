name: Update NetBox

on:
  workflow_dispatch:
    inputs:
      version:
        description: NetBox release tag (e.g. v4.7.4). Leave empty for the latest stable release.
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: update-netbox

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve NetBox release
        id: netbox
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
            prerelease=$(gh api "repos/netbox-community/netbox/releases/tags/$tag" --jq '.prerelease or .draft')
            if [ "$prerelease" != "false" ]; then
              echo "::error::$tag is not a stable NetBox release"
              exit 1
            fi
          else
            tag=$(gh api repos/netbox-community/netbox/releases/latest --jq .tag_name)
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected NetBox tag format: $tag"
            exit 1
          fi

          echo "NetBox release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out NetBox ${{ steps.netbox.outputs.tag }}
        env:
          TAG: ${{ steps.netbox.outputs.tag }}
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 netbox
          git -C netbox fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C netbox checkout --detach "$TAG"

      - name: Sync dependencies
        run: |
          sed -i "s/^requires-python = .*/$(grep -m1 '^requires-python' netbox/pyproject.toml)/" pyproject.toml
          sed -i '/^dependencies = \[/,/^\]/c\dependencies = []' pyproject.toml
          uv add --no-sync -r netbox/requirements.txt

      - name: Commit changes
        id: commit
        env:
          TAG: ${{ steps.netbox.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netbox pyproject.toml uv.lock

          if git diff --cached --quiet; then
            echo "Already up to date with NetBox $TAG"
          else
            git commit -m "⬆️ NetBox $TAG"
          fi

          # Release as the NetBox version, or vX.Y.Z.N when that tag is
          # already taken by an earlier build of this package.
          release="$TAG"
          revision=0
          while git rev-parse -q --verify "refs/tags/$release" > /dev/null; do
            if [ "$(git rev-list -n 1 "$release")" = "$(git rev-parse HEAD)" ]; then
              echo "HEAD is already released as $release"
              exit 0
            fi
            revision=$((revision + 1))
            release="$TAG.$revision"
          done

          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create release ${{ steps.commit.outputs.release }}
        if: steps.commit.outputs.release
        env:
          TAG: ${{ steps.netbox.outputs.tag }}
          RELEASE: ${{ steps.commit.outputs.release }}
        run: |
          git tag "$RELEASE"
          git push origin HEAD:main "refs/tags/$RELEASE"

          gh release create "$RELEASE" \
            --title "$RELEASE" \
            --notes "Types for [NetBox $TAG](https://github.com/netbox-community/netbox/releases/tag/$TAG)." \
            --generate-notes \
            --latest

          # Releases created with GITHUB_TOKEN do not trigger other workflows,
          # so start the publish workflow explicitly.
          gh workflow run publish.yaml --ref "$RELEASE"
